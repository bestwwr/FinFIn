name: FinFin Morning Digest

on:
  schedule:
    - cron: "0 1 * * *"  # 08:00 Bangkok (UTC+7)
  workflow_dispatch:      # รันด้วยมือได้จาก GitHub UI

permissions:
  contents: write

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run morning digest
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py

      - name: Persist subscriber list
        run: |
          if ! git diff --quiet -- subscribers.json; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add subscribers.json
            git commit -m "chore: update subscriber list [skip ci]"
            git push
          else
            echo "No subscriber changes."
          fi
